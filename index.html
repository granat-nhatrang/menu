<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Granat Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка меню как в бумажной книге, липкая лента разделов, корзина снизу. Один темный вид в цветах бренда (черный + золото + гранат). */
:root{
  --bg:#0f0c0b; --surface:#1a1513; --raise:#241d1a; --line:rgba(201,165,74,.22);
  --gold:#c9a54a; --gold-soft:#e2c97e; --fg:#f2ece3; --muted:#a39888; --wine:#8e2233; --ok:#6fae7c;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --body:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Header */
.top{display:flex;flex-direction:column;align-items:center;padding-block:22px 6px;text-align:center;gap:4px}
.top img{width:58px;height:auto;opacity:.95}
.brand{font:700 40px/1 var(--display);letter-spacing:.06em;color:var(--gold);margin:6px 0 0}
.brand small{display:block;font:600 11px/1 var(--body);letter-spacing:.42em;color:var(--fg);margin-top:8px;text-transform:uppercase}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;width:100%}
.table-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;letter-spacing:.02em}
.table-pill b{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#17110a}
.service{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;width:100%}
.service button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.service button svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.7}
.service button:disabled{opacity:.45}
.demo{margin-top:12px;font-size:12px;color:var(--gold-soft);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;width:100%}

/* Category strip */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:14px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;background:none;border:1px solid transparent;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.cats button.on{border-color:var(--gold);color:var(--gold)}

/* Sections */
section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
h2{font:600 30px/1.1 var(--display);color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin:30px 0 4px;text-wrap:balance}
h2 + .orn{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:6px;opacity:.6}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px dotted var(--line)}
.item.has-img{grid-template-columns:84px 1fr}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--raise)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.name{font:600 21px/1.15 var(--display);margin:0;text-wrap:balance}
.desc{font-size:12.5px;color:var(--muted);margin:0}
.opts{font-size:12px;color:var(--gold-soft);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.price{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price span{font-weight:500;color:var(--muted);font-size:12px;margin-left:3px}
.add{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.add:active{background:var(--gold);color:#17110a}
.step{display:flex;align-items:center;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.step button{background:none;border:0;width:34px;height:32px;font-size:18px;color:var(--gold);line-height:1}
.step output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.item.off{opacity:.45}
.soldout{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}

/* Footer */
footer{margin-top:40px;padding-block:22px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:13px;color:var(--muted)}
footer b{color:var(--fg);font-weight:600}
.wifi{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wifi button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--gold)}
footer a{color:var(--gold-soft)}

/* Cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;background:var(--gold);color:#17110a;border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cartbar .cnt{background:#17110a;color:var(--gold);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;margin-right:10px;padding:0 7px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:600 26px/1.15 var(--display);margin:4px 0 12px;color:var(--gold)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px dotted var(--line)}
.line .n{font-weight:600;font-size:14px}
.line .o{font-size:12px;color:var(--gold-soft)}
.line .p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:16px 0 4px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0 0 12px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
textarea,select{width:100%;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:64px;resize:vertical}
.primary{width:100%;background:var(--gold);color:#17110a;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;margin-top:14px}
.primary:disabled{opacity:.5}
.ghost{width:100%;background:none;border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;margin-top:8px;color:var(--muted)}
.choices{display:grid;gap:8px}
.choices button{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-weight:600}
.choices button:active{border-color:var(--gold)}
.err{color:#ff9b8f;font-size:13px;margin:10px 0 0}
.done{text-align:center;padding:16px 0 4px}
.done .mark{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 10px}
.done .mark svg{width:30px;stroke:var(--gold);fill:none;stroke-width:2.2}

/* Print QR */
.qr-page{max-width:900px;margin:0 auto;padding-block:20px}
.qr-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;color:var(--muted);font-size:13px}
.qr-tools button{background:var(--gold);color:#17110a;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.qr-card{background:#0f0c0b;border:1.5px solid var(--gold);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;break-inside:avoid}
.qr-card img.logo{width:44px}
.qr-card .b{font:700 30px/1 var(--display);color:var(--gold);letter-spacing:.06em}
.qr-card .t{font:600 22px/1 var(--display);color:var(--fg)}
.qr-card .qr{background:#fff;padding:10px;border-radius:10px}
.qr-card .qr img,.qr-card .qr canvas{display:block;width:170px!important;height:170px!important}
.qr-card .s{font-size:12px;color:var(--fg);letter-spacing:.06em}
.qr-card .u{font-size:9px;color:var(--muted);word-break:break-all}
@media print{
  body{padding:0;background:#fff}
  .qr-tools{display:none}
  .qr-grid{grid-template-columns:1fr 1fr;gap:10mm}
  .qr-card{-webkit-print-color-adjust:exact;print-color-adjust:exact;height:120mm;justify-content:center}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

      total:"Итого",comment:"Комментарий к заказу",commentPh:"Например: без лука, принести все сразу",send:"Отправить заказ",payNote:"Оплата официанту после еды.",
      empty:"В корзине пока ничего нет.",sold:"Нет в наличии",choose:"Выберите вариант",chooseTable:"Выберите ваш стол",chooseTableNote:"Номер стола указан на табличке с QR-кодом.",
      sent:"Заказ отправлен",sentNote:"Официант уже получил заказ и скоро подойдет.",num:"Заказ №",ok:"Хорошо",

      fail:"Не получилось отправить. Попробуйте еще раз или позовите официанта.",often:"Заказ с этого стола только что отправлен. Подождите 15 секунд.",cancel:"Отмена",demo:"Демо-режим: заказы пока никуда не отправляются.",
      wifi:"Wi‑Fi",pass:"пароль",copy:"Копировать",copied:"Скопировано",wait:"Можно повторить через минуту",sending:"Отправляем…",remove:"Убрать"},
  en:{table:"Table",noTable:"No table selected",waiter:"Call a waiter",bill:"Ask for the bill",add:"Add",cart:"Cart",yourOrder:"Your order",
      total:"Total",comment:"Note for the kitchen",commentPh:"E.g. no onions, serve everything at once",send:"Place order",payNote:"You pay the waiter after the meal.",
      empty:"Your cart is empty.",sold:"Sold out",choose:"Choose an option",chooseTable:"Choose your table",chooseTableNote:"The table number is on the QR stand.",
      sent:"Order sent",sentNote:"The waiter has your order and will come by shortly.",num:"Order #",ok:"OK",

};

var API = (window.GRANAT_API || "").trim();
var MENU = DEFAULT_MENU;
var params = new URLSearchParams(location.search);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var lang = store("granat_lang") || ((navigator.language||"ru").toLowerCase().indexOf("ru")===0 ? "ru" : "en");
function savedTable(){try{var o=JSON.parse(store("granat_table")||"null");if(o&&o.n&&Date.now()-o.at<4*3600e3)return String(o.n)}catch(e){}return""}
function saveTable(n){store("granat_table",JSON.stringify({n:n,at:Date.now()}))}
var table = params.get("t") || (/^#t(\d+)$/.exec(location.hash)||[])[1] || savedTable();
var cart = {};
try{cart = JSON.parse(store("granat_cart")||"{}")||{}}catch(e){cart={}}
var cooldown = {};

function t(k){return T[lang][k]}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" ₫"}
function h(tag,attrs,kids){var el=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;if(k==="text")el.textContent=v;else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v)}
  (kids||[]).forEach(function(c){if(c!=null&&c!==false)el.appendChild(typeof c==="string"?document.createTextNode(c):c)});return el}
function svg(path){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.innerHTML=path;return s}
var ICON_BELL='<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>';
var ICON_BILL='<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>';
var ICON_OK='<path d="M5 12.5l4.5 4.5L19 7.5"/>';

function itemById(id){for(var i=0;i<MENU.items.length;i++)if(String(MENU.items[i].id)===String(id))return MENU.items[i];return null}
function nm(it){return lang==="ru"?it.ru:(it.en||it.ru)}
function opts(it){var s=lang==="ru"?it.oru:(it.oen||it.oru);return s?s.split("/").map(function(x){return x.trim()}).filter(Boolean):[]}
function optLabel(it,i){var o=opts(it);return o[i]||""}
function tables(){return MENU.tables&&MENU.tables.length?MENU.tables:DEFAULT_MENU.tables}
function tableName(n){var tb=tables();for(var i=0;i<tb.length;i++)if(String(tb[i].n)===String(n))return lang==="ru"?tb[i].ru:tb[i].en;return n?t("table")+" "+n:""}
function imgSrc(f){if(!f)return"";return /^https?:/.test(f)?f:"img/"+f}
function saveCart(){store("granat_cart",JSON.stringify(cart))}
function cartLines(){var out=[];Object.keys(cart).forEach(function(k){var q=cart[k];var p=k.split("|");var it=itemById(p[0]);if(!it||q<=0||it.on===false){delete cart[k];return}out.push({key:k,it:it,opt:p[1]===""?-1:+p[1],qty:q})});return out}
function cartCount(){return cartLines().reduce(function(s,l){return s+l.qty},0)}
function cartSum(){return cartLines().reduce(function(s,l){return s+l.qty*l.it.price},0)}
function qtyOf(id){var s=0;Object.keys(cart).forEach(function(k){if(k.split("|")[0]===String(id))s+=cart[k]});return s}

/* ---------- Menu page ---------- */
function render(){
  document.documentElement.lang=lang;
  var app=document.getElementById("app");app.innerHTML="";
  var langBox=h("div",{class:"lang",role:"group","aria-label":"Language"},["ru","en"].map(function(l){return h("button",{type:"button","aria-pressed":String(lang===l),text:l.toUpperCase(),onclick:function(){lang=l;store("granat_lang",l);render()}})}));
  var pill=h("button",{type:"button",class:"table-pill",onclick:pickTable},table?[t("table")+": ",h("b",{text:tableName(table).replace(/^(Стол|Table)\s*/,"")})]:[t("noTable")]);
  var bell=h("button",{type:"button",id:"btn-waiter",onclick:function(){service("waiter")}},[svg(ICON_BELL),t("waiter")]);
  var bill=h("button",{type:"button",id:"btn-bill",onclick:askBill},[svg(ICON_BILL),t("bill")]);
  if(cooldown.waiter>Date.now())bell.disabled=true;
  if(cooldown.bill>Date.now())bill.disabled=true;
  app.appendChild(h("header",{class:"top"},[
    h("img",{src:"img/logo.png",alt:""}),
    h("div",{class:"brand"},["GRANAT",h("small",{text:"Restaurant"})]),
    h("div",{class:"bar"},[pill,langBox]),
    h("div",{class:"service"},[bell,bill]),
    API?null:h("div",{class:"demo",text:t("demo")})
  ]));
  var nav=h("nav",{class:"cats",id:"cats","aria-label":"Menu sections"});
  MENU.cats.forEach(function(c,i){
    if(!MENU.items.some(function(it){return it.cat===c.ru}))return;
    nav.appendChild(h("button",{type:"button","data-i":i,text:lang==="ru"?c.ru:c.en,onclick:function(){document.getElementById("s"+i).scrollIntoView({behavior:"smooth"})}}));
  });
  app.appendChild(nav);
  MENU.cats.forEach(function(c,i){
    var items=MENU.items.filter(function(it){return it.cat===c.ru});
    if(!items.length)return;
    var sec=h("section",{id:"s"+i},[h("h2",{text:lang==="ru"?c.ru:c.en}),h("div",{class:"orn"})]);
    items.forEach(function(it){sec.appendChild(itemEl(it))});
    app.appendChild(sec);
  });
  app.appendChild(h("footer",null,[
    h("div",{class:"wifi"},[h("div",null,[h("b",{text:t("wifi")+": "+INFO.wifi}),h("br"),t("pass")+": "+INFO.pass]),
      h("button",{type:"button",text:t("copy"),onclick:function(e){copy(INFO.pass,e.currentTarget)}})]),
    h("div",null,["Instagram: ",h("a",{href:"https://instagram.com/"+INFO.insta,target:"_blank",rel:"noopener",text:"@"+INFO.insta})]),
    h("div",{text:INFO.phones}),
    h("div",{text:INFO.address})
  ]));
  updateBar();spy();
}
function itemEl(it){
  var price=h("div",{class:"price"},[fmt(it.price).replace(" ₫",""),h("span",{text:"₫"})]);
  var ctl;
  if(it.on===false){ctl=h("span",{class:"soldout",text:t("sold")})}
  else{
    var q=qtyOf(it.id);var o=opts(it);
    if(q>0&&!o.length){
      ctl=h("div",{class:"step"},[h("button",{type:"button","aria-label":"−",text:"−",onclick:function(){change(it.id+"|",-1)}}),h("output",{text:String(q)}),h("button",{type:"button","aria-label":"+",text:"+",onclick:function(){change(it.id+"|",1)}})]);
    }else{
      ctl=h("button",{type:"button",class:"add",text:(q>0?q+" · ":"")+"+ "+t("add"),onclick:function(){o.length?pickOpt(it):change(it.id+"|",1)}});
    }
  }
  var desc=lang==="ru"?it.dru:(it.den||it.dru);
  var o2=opts(it);
  var info=h("div",{class:"info"},[h("h3",{class:"name",text:nm(it)}),desc?h("p",{class:"desc",text:desc}):null,o2.length?h("p",{class:"opts",text:o2.join(" · ")}):null,h("div",{class:"row"},[price,ctl])]);
  var el=h("div",{class:"item"+(it.img?" has-img":"")+(it.on===false?" off":""),"data-id":it.id},[it.img?h("img",{class:"thumb",src:imgSrc(it.img),alt:"",loading:"lazy"}):null,info]);
  if(!it.img)el.style.gridTemplateColumns="1fr";
  return el;
}
function refreshItem(id){var old=document.querySelector('.item[data-id="'+id+'"]');var it=itemById(id);if(old&&it)old.replaceWith(itemEl(it));updateBar()}
function change(key,d){cart[key]=(cart[key]||0)+d;if(cart[key]<=0)delete cart[key];saveCart();refreshItem(key.split("|")[0])}
function updateBar(){var c=cartCount();var bar=document.getElementById("cartbar");bar.hidden=c===0;
  document.getElementById("cnt").textContent=c;document.getElementById("cartlbl").textContent=t("cart");document.getElementById("carttotal").textContent=fmt(cartSum())}
function spy(){var nav=document.getElementById("cats");if(!nav)return;var secs=[].slice.call(document.querySelectorAll("section"));
  function on(){var y=window.scrollY+120,cur=secs[0];secs.forEach(function(s){if(s.offsetTop<=y)cur=s});
    [].forEach.call(nav.children,function(b){var a="s"+b.getAttribute("data-i")===(cur&&cur.id);if(a&&!b.classList.contains("on")){b.classList.add("on");b.scrollIntoView({block:"nearest",inline:"center"})}if(!a)b.classList.remove("on")})}
  window.onscroll=on;on()}
function copy(text,btn){var done=function(){btn.textContent=t("copied")};var no=function(){btn.textContent=text};try{navigator.clipboard.writeText(text).then(done,no)}catch(e){no()}}

/* ---------- Sheets ---------- */
function openSheet(nodes){var b=document.getElementById("sheetbody");b.innerHTML="";nodes.forEach(function(n){if(n)b.appendChild(n)});
  document.getElementById("scrim").hidden=false;document.getElementById("sheet").hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){document.getElementById("scrim").hidden=true;document.getElementById("sheet").hidden=true;document.body.style.overflow=""}
document.getElementById("scrim").onclick=closeSheet;
document.getElementById("cartbtn").onclick=function(){showCart()};

function pickOpt(it){
  openSheet([h("h3",{text:nm(it)}),h("p",{class:"note",text:t("choose")}),
    h("div",{class:"choices"},opts(it).map(function(o,i){return h("button",{type:"button",text:o,onclick:function(){change(it.id+"|"+i,1);closeSheet()}})})),
    h("button",{type:"button",class:"ghost",text:t("cancel"),onclick:closeSheet})]);
}
function pickTable(then){
  openSheet([h("h3",{text:t("chooseTable")}),h("p",{class:"note",text:t("chooseTableNote")}),
    h("div",{class:"choices"},tables().map(function(tb){return h("button",{type:"button",text:lang==="ru"?tb.ru:tb.en,onclick:function(){table=String(tb.n);saveTable(table);closeSheet();render();if(typeof then==="function")then()}})})),
    h("button",{type:"button",class:"ghost",text:t("cancel"),onclick:closeSheet})]);
}
function showCart(){
  var lines=cartLines();
  if(!lines.length){openSheet([h("h3",{text:t("yourOrder")}),h("p",{class:"note",text:t("empty")}),h("button",{type:"button",class:"ghost",text:t("ok"),onclick:closeSheet})]);return}
  var list=h("div");
  lines.forEach(function(l){
    list.appendChild(h("div",{class:"line"},[
      h("div",null,[h("div",{class:"n",text:nm(l.it)}),l.opt>=0?h("div",{class:"o",text:optLabel(l.it,l.opt)}):null,h("div",{class:"p",text:fmt(l.it.price)+" × "+l.qty})]),
      h("div",{class:"step"},[h("button",{type:"button","aria-label":t("remove"),text:"−",onclick:function(){change(l.key,-1);showCart()}}),h("output",{text:String(l.qty)}),h("button",{type:"button","aria-label":"+",text:"+",onclick:function(){change(l.key,1);showCart()}})])
    ]));
  });
  var ta=h("textarea",{id:"comment",placeholder:t("commentPh"),maxlength:"300"});ta.value=store("granat_comment")||"";ta.oninput=function(){store("granat_comment",ta.value)};
  var err=h("p",{class:"err",hidden:true});
  var btn=h("button",{type:"button",class:"primary",text:t("send")+" · "+fmt(cartSum())});
  btn.onclick=function(){
    if(!table){pickTable(showCart);return}
    btn.disabled=true;btn.textContent=t("sending");err.hidden=true;
    var payload={action:"order",table:table,lang:lang,comment:ta.value.trim(),items:cartLines().map(function(l){return{id:l.it.id,opt:l.opt>=0?((l.it.oru||l.it.oen||"").split("/")[l.opt]||"").trim():"",qty:l.qty}})};
    send(payload).then(function(r){
      cart={};saveCart();store("granat_comment","");render();
      openSheet([h("div",{class:"done"},[h("div",{class:"mark"},[svg(ICON_OK)]),h("h3",{text:t("sent")}),h("p",{class:"note",text:(r.num?t("num")+r.num+". ":"")+t("sentNote")})]),h("button",{type:"button",class:"primary",text:t("ok"),onclick:closeSheet})]);
    },function(e){btn.disabled=false;btn.textContent=t("send")+" · "+fmt(cartSum());err.textContent=t(e&&e.message==="too often"?"often":"fail");err.hidden=false});
  };
  openSheet([h("h3",{text:t("yourOrder")+(table?" · "+tableName(table):"")}),list,
    h("div",{class:"total"},[h("span",{text:t("total")}),h("span",{text:fmt(cartSum())})]),
    h("label",{class:"lbl","for":"comment",text:t("comment")}),ta,err,btn,h("p",{class:"note",style:"text-align:center;margin-top:10px",text:t("payNote")})]);
}
function askBill(){
  openSheet([h("h3",{text:t("bill")}),h("p",{class:"note",text:t("payHow")}),
    h("div",{class:"choices"},[["cash","Наличные"],["card","Карта"],["transfer","Перевод по QR"]].map(function(p){return h("button",{type:"button",text:t(p[0]),onclick:function(){closeSheet();service("bill",p[1])}})})),
    h("button",{type:"button",class:"ghost",text:t("cancel"),onclick:closeSheet})]);
}
function service(kind,pay){
  if(!table){pickTable(function(){kind==="bill"?askBill():service(kind)});return}
  send({action:kind,table:table,pay:pay||""}).then(function(){
    cooldown[kind]=Date.now()+60000;setTimeout(render,60500);render();
    openSheet([h("div",{class:"done"},[h("div",{class:"mark"},[svg(ICON_OK)]),h("h3",{text:t(kind==="bill"?"billSent":"waiterSent")}),h("p",{class:"note",text:t("wait")})]),h("button",{type:"button",class:"primary",text:t("ok"),onclick:closeSheet})]);
  },function(){openSheet([h("h3",{text:t("fail")}),h("button",{type:"button",class:"primary",text:t("ok"),onclick:closeSheet})])});
}

/* ---------- Network ---------- */
function send(payload){
  if(!API)return new Promise(function(res){setTimeout(function(){res({ok:true,num:""})},700)});
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||"fail");return j});
}
function loadMenu(){
  if(!API)return Promise.resolve();
  var ctrl=window.AbortController?new AbortController():null;var tm=setTimeout(function(){ctrl&&ctrl.abort()},8000);
  return fetch(API+"?action=menu",{signal:ctrl&&ctrl.signal}).then(function(r){return r.json()}).then(function(j){clearTimeout(tm);if(j&&j.items&&j.items.length){MENU=j}}).catch(function(){clearTimeout(tm)});
}

/* ---------- QR print page (?qr=1 or #qr) ---------- */
function qrPage(){
  document.getElementById("cartbar").remove();
  var base=location.origin+location.pathname;
  var app=document.getElementById("app");app.className="qr-page";app.innerHTML="";
  app.appendChild(h("div",{class:"qr-tools"},[h("button",{type:"button",text:"Печать",onclick:function(){window.print()}}),"Таблички для столов. Печатайте в цвете, «Фон» в настройках печати должен быть включен."]));
  var grid=h("div",{class:"qr-grid"});app.appendChild(grid);
  tables().forEach(function(tb){
    var url=base+"?t="+encodeURIComponent(tb.n);var box=h("div",{class:"qr"});
    grid.appendChild(h("div",{class:"qr-card"},[h("img",{class:"logo",src:"img/logo.png",alt:""}),h("div",{class:"b",text:"GRANAT"}),h("div",{class:"t",text:tb.ru}),box,
      h("div",{class:"s",text:"МЕНЮ И ЗАКАЗ · MENU & ORDER"}),h("div",{class:"u",text:url})]));
    if(window.QRCode)new QRCode(box,{text:url,width:340,height:340,colorDark:"#0f0c0b",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    else box.appendChild(h("img",{alt:"QR",src:"https://api.qrserver.com/v1/create-qr-code/?size=340x340&margin=0&data="+encodeURIComponent(url)}));
  });
}
if(params.has("qr")||location.hash==="#qr"){
  var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload=function(){loadMenu().then(qrPage)};s.onerror=function(){window.QRCode=null;loadMenu().then(qrPage)};document.head.appendChild(s);
}else{
  if(table)saveTable(table);
  render();
  loadMenu().then(function(){if(API)render()});
}
</script>
